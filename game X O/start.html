<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X O Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game">
    <h1>tic-tac-toe</h1>

    <div class="player">
      <img src="./img/1-removebg-preview.png" alt="Player X">
      <div class="current-turn">X</div>
      <img src="./img/1__1_-removebg-preview.png" alt="Player O">
    </div>
    <div id="statusText"></div>
    <button id="restartBtn" class="button">Restart Game</button>
   <div class="board">
  <div class="cell" cellIndex="0"></div>
  <div class="cell" cellIndex="1"></div>
  <div class="cell" cellIndex="2"></div>

  <div class="cell" cellIndex="3"></div>
  <div class="cell" cellIndex="4"></div>
  <div class="cell" cellIndex="5"></div>

  <div class="cell" cellIndex="6"></div>
  <div class="cell" cellIndex="7"></div>
  <div class="cell" cellIndex="8"></div>
</div>
</div>

  <div class="popup-content">
    <h2 id="popupText"></h2>
    <button onclick="closePopup()">OK</button>
  </div>
</div> -->

<script src="index.js"></script>

  
</body>
</html>
